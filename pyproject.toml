[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlmdspwp01"
version = "0.1.0"
description = "Reproducible ideal-function selection and test-point mapping"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bokeh>=3.4,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
ideal-function-assignment = "ideal_function_assignment.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
